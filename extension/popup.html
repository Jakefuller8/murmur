<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --ink: #15171c;
    --raised: #1f232b;
    --edge: #2c313b;
    --fg: #e9edf3;
    --dim: #8b95a3;
    --live: #4ec78f;
    --warn: #e0a33e;
    --signal: #3d7bf7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    width: 288px;
    padding: 18px;
    background: var(--ink);
    color: var(--fg);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  h1 { margin: 0 0 14px; font-size: 15px; font-weight: 500; }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; color: var(--dim); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
  .dot[data-state="paired"] { background: var(--live); }
  .dot[data-state="waiting"] { background: var(--warn); }
  label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 5px; }
  input {
    width: 100%;
    background: var(--raised);
    border: 1px solid var(--edge);
    border-radius: 8px;
    color: var(--fg);
    padding: 9px 10px;
    font-size: 14px;
    margin-bottom: 14px;
    font-family: inherit;
  }
  input:focus { outline: none; border-color: var(--signal); }
  #room {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .18em;
    text-transform: uppercase;
  }
  button {
    width: 100%;
    background: var(--signal);
    border: 0;
    border-radius: 8px;
    color: #fff;
    padding: 10px;
    font-size: 14px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
  }
  .link {
    display: block;
    margin-top: 14px;
    font-size: 12px;
    color: var(--dim);
    word-break: break-all;
    text-decoration: none;
  }
  .link b { color: var(--fg); font-weight: 500; }
</style>
</head>
<body>
  <h1>Murmur</h1>

  <div class="row">
    <span class="dot" id="dot"></span>
    <span id="status">Not configured</span>
  </div>

  <label for="relay">Relay address</label>
  <input id="relay" placeholder="murmur-relay.onrender.com" autocomplete="off" spellcheck="false">

  <label for="room">Pairing code</label>
  <input id="room" maxlength="6" placeholder="ABC234" autocomplete="off" spellcheck="false">

  <button id="save">Save and connect</button>

  <a class="link" id="phoneLink" href="#" target="_blank"></a>

  <script src="popup.js"></script>
</body>
</html>
